spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: measurement-service

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    # Only the measurement changesets. The schema is shared with energy-monitor-backend, the
    # security service and the device service (ADR-003), and so is the DATABASECHANGELOG table:
    # each service applies its own changelogs.
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  # 8080 is the API gateway, 8082 the security service, 8083 energy-monitor-backend and 8084 the
  # device service when all run on the same machine.
  port: ${SERVER_PORT:8085}
  # The web and mobile requests come through the API gateway: from it (loopback or a Docker
  # network) the container takes the caller's address and scheme from X-Forwarded-For and
  # X-Forwarded-Proto. A call from outside relayed with a forwarded address therefore counts as
  # that address, and the internal API refuses it.
  forward-headers-strategy: native
  tomcat:
    # Only loopback (the gateway or nginx on this machine) and the Docker networks may set it: the
    # default would trust every private network, and a machine of the LAN could then pass as
    # 127.0.0.1.
    remoteip:
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

security:
  jwt:
    # The access tokens are issued by the security service; this service only validates them, with
    # the service's public key and its iss claim (the value the monolith used, kept unchanged).
    issuer: https://energy-monitor-backend
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

# Calls from this service to the owners of homes and devices: whether a caller belongs to a home
# and its limits (energy-monitor-backend), and which home a device is linked to (the device
# service). No answer within the timeouts refuses the request with 503. Each of them checks this
# service's network and the shared token; the reverse proxy never forwards /internal/**.
internal-api:
  # Same value in every service. Generate with: openssl rand -hex 32
  token: ${INTERNAL_API_TOKEN:}
  backend-url: ${BACKEND_INTERNAL_URL:http://localhost:8083}
  device-service-url: ${DEVICE_SERVICE_URL:http://localhost:8084}
  connect-timeout: PT1S
  read-timeout: PT2S
  # A device, or the devices of a home, are reused for 30 s; the last answer is served for up to
  # an hour while the device service does not answer.
  device-ttl: PT30S
  device-stale-ttl: PT1H

measurement:
  # A reading older than this no longer counts as the current power of a home: the threshold after
  # which the device service marks a silent device offline (its DEVICE_OFFLINE_AFTER).
  current-power-freshness: ${DEVICE_OFFLINE_AFTER:PT150S}

management:
  endpoints:
    web:
      exposure:
        include: health,info
